#http
services:
  app:
    image: ghcr.io/mahn-ke/rcon-by-vincent:latest@sha256:81c801b3a680ec723e36d44b49879c5a09e85a1fcb3b4c3916941bee57972457
    restart: on-failure:5
    environment:
      - RCON_SERVER=${RCON_SERVER}
      - RCON_PASSWORD=${RCON_PASSWORD}
      - ALLOWLIST_SECRET=${ALLOWLIST_SECRET}
      - PORT=3000
    ports:
      - "3016:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
