#http
services:
  app:
    image: ghcr.io/mahn-ke/rcon-by-vincent:latest@sha256:b936100a04cd1782c1e75bdc2438f5ad9653624952d692c4859e19d2beae0d4b
    restart: on-failure:5
    environment:
      - RCON_SERVER=${RCON_SERVER}
      - RCON_PASSWORD=${RCON_PASSWORD}
      - ALLOWLIST_SECRET=${ALLOWLIST_SECRET}
      - PORT=3000
    ports:
      - "3016:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
